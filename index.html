<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PlantCare CMMS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#e8eef7}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#0b1626ee;backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid #203047}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:19px;margin:0}.sub{font-size:11px;color:#8fa1b8;margin-top:3px}
.lang{background:#142238;color:#dce8f7;border:1px solid #2a3b55;border-radius:10px;padding:8px}
.wrap{max-width:1100px;margin:auto;padding:16px 14px 90px}
.nav{display:flex;gap:8px;overflow:auto;padding:10px 0 14px;position:sticky;top:65px;z-index:4;background:#07111ff5}
.nav button{white-space:nowrap;border:1px solid #263952;background:#0d1a2b;color:#b9c8da;border-radius:12px;padding:9px 12px}.nav button.active{background:#1e78ff;color:white;border-color:#1e78ff}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#0d1a2b;border:1px solid #20324a;border-radius:16px;padding:14px}.k{font-size:12px;color:#91a4bd}.v{font-size:25px;font-weight:800;margin-top:4px}.good{color:#42d392}.warn{color:#ffcc66}.bad{color:#ff7373}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.panel{background:#0d1a2b;border:1px solid #20324a;border-radius:16px;padding:14px}.panel h2{font-size:16px;margin:0 0 12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1d2b3f}.row:last-child{border-bottom:0}.small{font-size:12px;color:#91a4bd}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;background:#172941;color:#cbd9ea}.tag.bad{background:#4a2028;color:#ffb7b7}.tag.warn{background:#4a3a1d;color:#ffe0a0}.btn{border:0;border-radius:11px;padding:10px 13px;background:#1e78ff;color:#fff}.btn.secondary{background:#17283f;color:#dce8f7;border:1px solid #2b405e}.btn.danger{background:#9f3040}
form{display:grid;gap:9px}input,select,textarea{width:100%;background:#081322;color:#eaf1fa;border:1px solid #2a3d58;border-radius:10px;padding:10px}textarea{min-height:80px}
.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{text-align:right;padding:10px;border-bottom:1px solid #203047;font-size:12px}.table th{color:#91a4bd}
.hidden{display:none}.empty{color:#91a4bd;padding:15px 0}.footer{position:fixed;bottom:0;left:0;right:0;background:#091424f2;border-top:1px solid #203047;padding:10px 14px;display:flex;justify-content:center;z-index:6}.footer button{width:min(600px,100%);padding:12px;border:0;border-radius:13px;background:#1e78ff;color:#fff;font-weight:700}
@media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div><h1>PlantCare CMMS</h1><div class="sub" id="subtitle">سیستەمی بەڕێوەبردنی چاکسازی و پاراستن</div></div><select class="lang" id="lang"><option value="ku">کوردی</option><option value="ar">العربية</option><option value="en">English</option></select></div></header>
<div class="wrap">
<nav class="nav" id="nav"></nav>
<section id="dashboard"></section>
<section id="assets" class="hidden"></section>
<section id="workorders" class="hidden"></section>
<section id="inspection" class="hidden"></section>
<section id="reports" class="hidden"></section>
</div>
<div class="footer"><button id="newWO">＋ <span id="newWOTxt">Work Order نوێ</span></button></div>

<script>
const T={
ku:{dash:"داشبۆرد",assets:"ئامێرەکان",wo:"Work Orders",inspect:"پشکنین",reports:"ڕاپۆرت",sub:"سیستەمی بەڕێوەبردنی چاکسازی و پاراستن",newwo:"Work Order نوێ",total:"کۆی ئامێر",open:"کارە کراوەکان",overdue:"PM دواخراو",low:"کۆگای کەم",running:"کارا",attention:"ئاگاداری",high:"بەرز",normal:"ئاسایی",save:"پاشەکەوتکردن",create:"دروستکردن",close:"داخستن",actual:"نرخی ڕاستەقینە",max:"سنووری زۆرترین",asset:"ئامێر",problem:"کێشە",priority:"گرنگی",status:"دۆخ",generate:"دروستکردنی ڕاپۆرت",download:"داگرتنی CSV",reportTitle:"ڕاپۆرتی خودکار",no:"هیچ داتا نییە"},
ar:{dash:"لوحة التحكم",assets:"المعدات",wo:"أوامر العمل",inspect:"الفحص",reports:"التقارير",sub:"نظام إدارة الصيانة",newwo:"أمر عمل جديد",total:"إجمالي المعدات",open:"أوامر مفتوحة",overdue:"PM متأخر",low:"مخزون منخفض",running:"يعمل",attention:"تنبيه",high:"مرتفع",normal:"طبيعي",save:"حفظ",create:"إنشاء",close:"إغلاق",actual:"القيمة الفعلية",max:"الحد الأعلى",asset:"المعدة",problem:"المشكلة",priority:"الأولوية",status:"الحالة",generate:"إنشاء التقرير",download:"تحميل CSV",reportTitle:"التقرير التلقائي",no:"لا توجد بيانات"},
en:{dash:"Dashboard",assets:"Assets",wo:"Work Orders",inspect:"Inspection",reports:"Reports",sub:"Computerized Maintenance Management System",newwo:"New Work Order",total:"Total Assets",open:"Open Work Orders",overdue:"Overdue PM",low:"Low Stock",running:"Running",attention:"Attention",high:"High",normal:"Normal",save:"Save",create:"Create",close:"Close",actual:"Actual Value",max:"Maximum Limit",asset:"Asset",problem:"Problem",priority:"Priority",status:"Status",generate:"Generate Report",download:"Download CSV",reportTitle:"Automatic Report",no:"No data"}};

let lang=localStorage.pc_lang||"ku";
let data=JSON.parse(localStorage.pc_data||"null")||{
assets:[
{id:"HC-001",name:"Hammer Crusher",dept:"Mechanical",status:"Running",criticality:"Critical",hours:4820},
{id:"RM-001",name:"Raw Mill",dept:"Mechanical",status:"Attention",criticality:"High",hours:6310}],
wo:[{id:"WO-0001",asset:"HC-001",problem:"Fixed Bearing vibration above limit",priority:"HIGH",status:"NEW"}],
spares:[{part:"BRG-6309",name:"Fixed Bearing",stock:2,min:4},{part:"HAM-HC01",name:"Crusher Hammer",stock:18,min:10},{part:"OIL-EP220",name:"Gear Oil",stock:3,min:5}],
pm:[{asset:"RM-001",task:"Gearbox Oil Analysis",due:"2026-09-30",status:"Planned"},{asset:"HC-001",task:"Bearing Vibration Check",due:"2026-09-25",status:"Overdue"}],
inspections:[]
};

function t(k){return T[lang][k]||k}
function save(){localStorage.pc_data=JSON.stringify(data)}
function nav(){document.getElementById("nav").innerHTML=[["dashboard","dash"],["assets","assets"],["workorders","wo"],["inspection","inspect"],["reports","reports"]].map(([id,k])=>`<button onclick="show('${id}')">${t(k)}</button>`).join("")}
function show(id){["dashboard","assets","workorders","inspection","reports"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));render();window.scrollTo({top:0,behavior:"smooth"})}

function render(){
nav(); document.getElementById("subtitle").textContent=t("sub"); document.getElementById("newWOTxt").textContent=t("newwo");
renderDash();renderAssets();renderWO();renderInspection();renderReports();
}
function renderDash(){
let low=data.spares.filter(x=>x.stock<x.min).length, overdue=data.pm.filter(x=>x.status==="Overdue").length;
document.getElementById("dashboard").innerHTML=`<div class="cards">
<div class="card"><div class="k">${t("total")}</div><div class="v">${data.assets.length}</div></div>
<div class="card"><div class="k">${t("open")}</div><div class="v warn">${data.wo.filter(x=>x.status!=="CLOSED").length}</div></div>
<div class="card"><div class="k">${t("overdue")}</div><div class="v bad">${overdue}</div></div>
<div class="card"><div class="k">${t("low")}</div><div class="v bad">${low}</div></div></div>
<div class="grid">
<div class="panel"><h2>${t("assets")}</h2>${data.assets.map(a=>`<div class="row"><div><b>${a.id}</b><div class="small">${a.name}</div></div><span class="tag ${a.status==="Attention"?"warn":""}">${a.status}</span></div>`).join("")}</div>
<div class="panel"><h2>${t("wo")}</h2>${data.wo.slice(0,5).map(w=>`<div class="row"><div><b>${w.id}</b><div class="small">${w.problem}</div></div><span class="tag ${w.priority==="HIGH"?"bad":""}">${w.priority}</span></div>`).join("")}</div>
<div class="panel"><h2>${t("low")}</h2>${data.spares.filter(x=>x.stock<x.min).map(s=>`<div class="row"><div><b>${s.part}</b><div class="small">${s.name}</div></div><span class="tag bad">${s.stock}/${s.min}</span></div>`).join("")||`<div class="empty">${t("normal")}</div>`}</div>
</div>`;
}
function renderAssets(){
document.getElementById("assets").innerHTML=`<div class="panel"><h2>${t("assets")}</h2><div class="table"><table><tr><th>ID</th><th>Name</th><th>Department</th><th>Status</th><th>Criticality</th><th>Hours</th></tr>${data.assets.map(a=>`<tr><td>${a.id}</td><td>${a.name}</td><td>${a.dept}</td><td>${a.status}</td><td>${a.criticality}</td><td>${a.hours}</td></tr>`).join("")}</table></div></div>`;
}
function renderWO(){
document.getElementById("workorders").innerHTML=`<div class="panel"><h2>${t("wo")}</h2>${data.wo.map((w,i)=>`<div class="row"><div><b>${w.id}</b><div class="small">${w.asset} · ${w.problem}</div></div><div><span class="tag ${w.priority==="HIGH"?"bad":""}">${w.priority}</span> <span class="tag">${w.status}</span><button class="btn secondary" style="margin-right:5px" onclick="closeWO(${i})">${t("close")}</button></div></div>`).join("")}</div>`;
}
function renderInspection(){
document.getElementById("inspection").innerHTML=`<div class="panel"><h2>${t("inspect")}</h2><form onsubmit="inspect(event)">
<select id="ia">${data.assets.map(a=>`<option value="${a.id}">${a.id} — ${a.name}</option>`).join("")}</select>
<input id="ip" placeholder="Inspection Point / Component" value="Fixed Bearing">
<input id="actual" type="number" step="0.1" placeholder="${t("actual")}">
<input id="max" type="number" step="0.1" value="4.5" placeholder="${t("max")}">
<textarea id="comment" placeholder="Comment"></textarea>
<button class="btn">${t("save")}</button></form></div>`;
}
function inspect(e){
e.preventDefault();let asset=document.getElementById("ia").value,actual=+document.getElementById("actual").value,max=+document.getElementById("max").value;
let status=actual>max?"HIGH":"NORMAL";data.inspections.push({asset,point:document.getElementById("ip").value,actual,max,status,time:new Date().toISOString()});
if(status==="HIGH"){let id="WO-"+String(data.wo.length+1).padStart(4,"0");data.wo.unshift({id,asset,problem:`${document.getElementById("ip").value}: ${actual} > ${max}`,priority:"HIGH",status:"NEW"});alert(`⚠️ HIGH → ${id} ${t("create")}`)}else alert(`✓ ${t("normal")}`);
save();render();
}
function closeWO(i){data.wo[i].status="CLOSED";save();render();}
function renderReports(){document.getElementById("reports").innerHTML=`<div class="panel"><h2>${t("reportTitle")}</h2><p class="small">${new Date().toLocaleString()} · PlantCare CMMS</p><div class="row"><span>${t("total")}</span><b>${data.assets.length}</b></div><div class="row"><span>${t("open")}</span><b>${data.wo.filter(x=>x.status!=="CLOSED").length}</b></div><div class="row"><span>${t("overdue")}</span><b>${data.pm.filter(x=>x.status==="Overdue").length}</b></div><div class="row"><span>${t("low")}</span><b>${data.spares.filter(x=>x.stock<x.min).length}</b></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="printReport()">${t("generate")}</button><button class="btn secondary" onclick="csv()">${t("download")}</button></div></div>`}
function printReport(){window.print()}
function csv(){let rows=[["ID","Asset","Problem","Priority","Status"],...data.wo.map(w=>[w.id,w.asset,w.problem,w.priority,w.status])];let s=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="plantcare-work-orders.csv";a.click();}
document.getElementById("lang").value=lang;document.getElementById("lang").onchange=e=>{lang=e.target.value;localStorage.pc_lang=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";render()};
document.getElementById("newWO").onclick=()=>{let id="WO-"+String(data.wo.length+1).padStart(4,"0");let p=prompt(`${t("problem")}:`);if(!p)return;let a=data.assets[0]?.id||"HC-001";data.wo.unshift({id,asset:a,problem:p,priority:"MEDIUM",status:"NEW"});save();show("workorders")};
document.documentElement.dir=lang==="en"?"ltr":"rtl";render();
</script>
</body></html>
