<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#10141a; --bg2:#0a0d11;
  --panel:#161b22; --panel2:#1d242c;
  --border:#28323c; --border-lite:#3a4652;
  --text:#eef2f4; --dim:#94a3ae; --dim2:#5c6b77;
  --amber:#e6a537; --amber-deep:#b97e22; --red:#e05f47; --green:#49ad78; --blue:#5b9bde; --steel:#7c8b97;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans Arabic',sans-serif;
  --r:5px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{
  background-image:
    radial-gradient(ellipse 900px 500px at 85% -10%, rgba(230,165,55,.07), transparent 60%),
    linear-gradient(var(--bg2) 1px,transparent 1px),
    linear-gradient(90deg,var(--bg2) 1px,transparent 1px);
  background-size:auto,38px 38px,38px 38px;
  background-attachment:fixed;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border-lite);border-radius:6px;}
a{color:var(--blue);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13.5px;width:100%;}
input::placeholder,textarea::placeholder{color:var(--dim2);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;}
.field{margin-bottom:12px;}
.btn{background:var(--panel2);border:1px solid var(--border-lite);color:var(--text);padding:9px 16px;border-radius:var(--r);font-size:13.5px;font-weight:500;transition:border-color .15s,background .15s,transform .1s;}
.btn:hover{border-color:var(--steel);background:#232c34;}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#181206;font-weight:700;}
.btn.primary:hover{background:#f0b355;border-color:#f0b355;}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:rgba(224,95,71,.12);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

#app{display:flex;min-height:100%;}
.sidebar{
  width:206px;flex:0 0 206px;background:linear-gradient(180deg,var(--panel),var(--bg2));border-inline-end:1px solid var(--border);
  padding:18px 12px;position:sticky;top:0;align-self:flex-start;height:100dvh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand .mark{width:40px;height:40px;background:#fff;border:1px solid var(--border-lite);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;padding:4px;}
.brand .mark img{width:100%;height:100%;object-fit:contain;}
.brand .t1{font-weight:700;font-size:14.5px;letter-spacing:.2px;}
.brand .t2{font-size:10.5px;color:var(--dim);font-family:var(--mono);}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;color:var(--dim);cursor:pointer;font-size:13px;margin-bottom:2px;border:1px solid transparent;transition:background .12s,color .12s;}
.navitem:hover{background:var(--panel2);color:var(--text);}
.navitem.active{background:var(--panel2);color:var(--text);border-color:var(--border-lite);}
.navitem .ic{font-size:13.5px;width:26px;height:26px;flex:none;border-radius:6px;background:var(--bg2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
.navitem.active .ic{background:var(--amber);border-color:var(--amber);filter:none;}
.navgap{height:10px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--topbar-bg);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:11px 20px;padding-top:calc(11px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.topbar h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:120px;letter-spacing:-.01em;}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--dim);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.dot.off{background:var(--red);box-shadow:0 0 6px var(--red);}
.roleSel{width:auto;padding:6px 8px;font-size:12.5px;}
.bellwrap{position:relative;}
.bell{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;font-size:14px;position:relative;}
.bell:hover{border-color:var(--steel);}
.bellcount{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-family:var(--mono);}
.view{padding:20px;padding-bottom:60px;max-width:1180px;width:100%;margin:0 auto;animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;position:relative;margin-bottom:16px;box-shadow:var(--shadow,none);}
.panel::before,.panel::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--border-lite);top:-1px;}
.panel::before{inset-inline-end:-1px;border-top:2px solid;border-inline-end:2px solid;}
.panel::after{inset-inline-start:-1px;border-bottom:2px solid;border-inline-start:2px solid;bottom:-1px;top:auto;}
.panel h2{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.01em;}
.panel h2 small{color:var(--dim2);font-weight:400;font-size:11px;font-family:var(--mono);}

.grid{display:grid;gap:12px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr;}#app{flex-direction:column;}.sidebar{width:100%;flex:none;height:auto;position:relative;display:flex;overflow-x:auto;gap:2px;padding:8px;}
  .brand{display:none;}.navitem{flex:0 0 auto;white-space:nowrap;}.navgap{display:none;}}

.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:13px 14px;display:flex;align-items:center;gap:11px;border-inline-start:3px solid var(--border-lite);transition:border-color .15s,transform .15s;box-shadow:var(--shadow,none);}
.kpi:hover{transform:translateY(-1px);}
.kpi.kpi-green{border-inline-start-color:var(--green);}
.kpi.kpi-amber{border-inline-start-color:var(--amber);}
.kpi.kpi-red{border-inline-start-color:var(--red);}
.kpi.kpi-blue{border-inline-start-color:var(--blue);}
.kpi-ic{width:34px;height:34px;flex:none;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:16px;}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:700;line-height:1.1;}
.kpi .l{font-size:11px;color:var(--dim);margin-top:3px;}
.kpi .v.amber{color:var(--amber);}.kpi .v.red{color:var(--red);}.kpi .v.green{color:var(--green);}

.hero{background:linear-gradient(135deg,var(--panel),var(--panel2) 60%);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:16px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:var(--shadow,none);}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,rgba(230,165,55,.10),transparent 55%);pointer-events:none;}
.hero-gauge{flex:none;position:relative;z-index:1;}
.hero-info{flex:1;min-width:220px;position:relative;z-index:1;}
.hero-info h2{margin:0 0 6px;font-size:19px;}
.hero-info p{margin:0 0 14px;color:var(--dim);font-size:13px;max-width:460px;}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;}
.hero-stat span{font-size:11px;color:var(--dim);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:start;color:var(--dim);font-weight:600;font-size:11px;padding:8px;border-bottom:1px solid var(--border-lite);white-space:nowrap;letter-spacing:.01em;}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.row{cursor:pointer;transition:background .1s;}
tr.row:hover td{background:var(--panel2);}
.twrap{overflow-x:auto;}
.empty{color:var(--dim2);text-align:center;padding:34px 10px;font-size:13px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono);border:1px solid transparent;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.b-normal,.b-ok,.b-running,.b-closed,.b-completed{background:rgba(73,173,120,.13);color:var(--green);border-color:rgba(73,173,120,.28);}
.b-attention,.b-open,.b-medium{background:rgba(230,165,55,.13);color:var(--amber);border-color:rgba(230,165,55,.28);}
.b-high,.b-critical,.b-stopped,.b-notok,.b-high\_prio{background:rgba(224,95,71,.13);color:var(--red);border-color:rgba(224,95,71,.28);}
.b-progress,.b-review,.b-low{background:rgba(91,155,222,.13);color:var(--blue);border-color:rgba(91,155,222,.28);}

.modalbg{position:fixed;inset:0;background:rgba(8,10,12,.68);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;}
.modal{background:var(--panel);border:1px solid var(--border-lite);border-radius:8px;width:100%;max-width:560px;padding:20px;margin-top:10px;}
.modal h3{margin:0 0 14px;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;}
.modal .x{background:none;border:none;color:var(--dim);font-size:20px;padding:0;line-height:1;}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border-lite);border-radius:var(--r);padding:10px 18px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.4);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:8px 13px;font-size:12.5px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--text);border-color:var(--amber);}

.assetcard{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:15px 16px;margin-bottom:12px;border-inline-start:3px solid var(--border-lite);transition:border-color .15s;}
.assetcard[data-status="Running"]{border-inline-start-color:var(--green);}
.assetcard[data-status="Stopped"]{border-inline-start-color:var(--red);}
.assetcard[data-status="Attention"]{border-inline-start-color:var(--amber);}
.assetcard:hover{border-color:var(--border-lite);}
.assetcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.assetcard h3{margin:0;font-size:15.5px;font-weight:700;}
.assetcard .sub{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:3px;}
.complist{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11.5px;color:var(--dim);}
.metarow{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px;font-size:12px;color:var(--dim);}
.metarow b{color:var(--text);font-weight:600;}

.notif{padding:10px 8px;border-bottom:1px solid var(--border);font-size:12.5px;}
.notif:last-child{border:none;}
.notif .m{color:var(--text);}
.notif .t{color:var(--dim2);font-family:var(--mono);font-size:11px;margin-top:2px;}
.notif.unread{background:rgba(226,165,58,.06);border-inline-start:2px solid var(--amber);}

.perm-table td,.perm-table th{font-size:12.5px;}
.svgchart text{font-family:var(--mono);}
.hint{font-size:11.5px;color:var(--dim2);margin-top:10px;line-height:1.6;}
.rolebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.qrbox{background:#fff;padding:10px;border-radius:4px;display:inline-block;}
.photothumb{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
.lowstock{color:var(--red);font-weight:600;}

/* ===== theme tokens ===== */
:root{ --topbar-bg:rgba(16,20,26,.88); --shadow:none; }
:root[data-theme="light"]{
  --bg:#f3f5f7; --bg2:#e7ebee;
  --panel:#ffffff; --panel2:#f1f4f6;
  --border:#dbe1e6; --border-lite:#c4cdd4;
  --text:#161b20; --dim:#5b6b76; --dim2:#8695a0;
  --topbar-bg:rgba(255,255,255,.86);
  --shadow:0 1px 2px rgba(20,30,40,.05),0 4px 14px rgba(20,30,40,.06);
}
:root[data-theme="light"] body{ background-image:
    radial-gradient(ellipse 900px 500px at 85% -10%, rgba(230,165,55,.06), transparent 60%),
    linear-gradient(var(--bg2) 1px,transparent 1px),
    linear-gradient(90deg,var(--bg2) 1px,transparent 1px); }
:root[data-theme="light"] .qrbox{border:1px solid var(--border);}
:root[data-theme="light"] .modalbg{background:rgba(30,38,46,.45);}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:var(--bg2);}
:root[data-theme="light"] .btn{background:var(--panel2);}
:root[data-theme="light"] .btn:hover{background:#e3e8eb;}

/* ===== MAS branding: watermark + logo mark ===== */
.masmark{display:flex;align-items:center;justify-content:center;}
.masmark svg{display:block;}
body{position:relative;}
#app{position:relative;z-index:1;}
.watermark{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;display:flex;align-items:center;justify-content:center;overflow:hidden;}
:root[data-theme="light"] .watermark{opacity:.05;}
.watermark img{width:min(60vw,620px);height:auto;object-fit:contain;}

/* ===== splash / entry gate ===== */
.splash{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.splash-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:34px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative;overflow:hidden;}
.splash-card .masmark{margin:0 auto 16px;background:#fff;border-radius:12px;padding:14px 18px;display:inline-flex;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.splash-card .masmark img{display:block;height:56px;width:auto;}
.splash-card h2{margin:0 0 4px;font-size:19px;}
.splash-card p{color:var(--dim);font-size:12.5px;margin:0 0 20px;}
.splash-card .field{text-align:start;}
.splash-langs{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.splash-langs button{flex:1;padding:8px 6px;font-size:12px;}
.splash-langs button.active{background:var(--amber);border-color:var(--amber);color:#181206;font-weight:700;}

/* ===== top controls ===== */
.selMini{width:auto;padding:6px 8px;font-size:12px;background:var(--panel2);}

/* ===== print ===== */
@media print{
  .sidebar,.topbar,.modalbg,#toastRoot,.btn,.watermark{display:none !important;}
  body{background:#fff !important;}
  .view{padding:0 !important;max-width:100% !important;animation:none !important;}
  .panel{border:1px solid #ccc !important;box-shadow:none !important;background:#fff !important;color:#000 !important;break-inside:avoid;}
  .panel h2{color:#000 !important;}
  table,th,td{color:#000 !important;border-color:#ccc !important;}
  .badge{border:1px solid #999 !important;color:#000 !important;background:#f2f2f2 !important;}

function T(key, vars){
  let s = (I18N[APP.lang] && I18N[APP.lang][key]) || I18N.ckb[key] || key;
  if(vars) for(const k in vars) s = s.replace('{'+k+'}', vars[k]);
  return s;
}
function FL(key){ return T('f_'+key); }
function MT(modKey){ const k='mod_'+modKey; const t=T(k); return t===k? (MODULES[modKey]?MODULES[modKey].title:modKey) : t; }
function vkey(v){ return String(v==null?'':v).trim().replace(/[\s\-]+/g,'_'); }
function V(v){ if(v==null||v==='') return '—'; const k='v_'+vkey(v); const t=T(k); return t===k? v : t; }

function resolvedTheme(){
  if(APP.theme==='system') return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark';
  return APP.theme;
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolvedTheme());
}
function applyLang(){
  document.documentElement.setAttribute('lang', APP.lang==='ckb'?'ckb':APP.lang);
  document.documentElement.setAttribute('dir', LANG_DIR[APP.lang]);
  document.title = 'Mass · CMMS — '+T('splash_subtitle');
}

function masLogoSVG(size){
  size = size||34;
  return `<img src="${MAS_LOGO_URI}" alt="Mass Group Holding" style="height:${size}px;width:auto;max-width:none;display:block;"/>`;
}
function masWatermarkSVG(){
  return `<img src="${MAS_LOGO_URI}" alt="" />`;
}

const APP = {
  db:null, assetsCap:null, downloadsCap:null,
  role: localStorage.getItem('cmms_role')||'Manager',
  techName: localStorage.getItem('cmms_tech')||'',
  lang: localStorage.getItem('cmms_lang')||'ckb',
  theme: localStorage.getItem('cmms_theme')||'dark',
  online: navigator.onLine,
  queue: JSON.parse(localStorage.getItem('cmms_queue')||'[]'),
  cache: {assets:[],inspections:[],pm:[],work_orders:[],breakdowns:[],rca:[],spare_parts:[],shutdowns:[],audit_log:[],notifications:[]},
  route:'dashboard',
  seeded:false,
};
const COLS = Object.keys(APP.cache);
function uid(pfx){return pfx+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function nowLocalInput(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function todayInput(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function fmtDT(iso){if(!iso)return'—';try{const d=new Date(iso);return d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function fmtD(iso){if(!iso)return'—';try{const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});}catch(e){return iso;}}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const r=document.getElementById('toastRoot');const t=document.createElement('div');t.className='toast';t.textContent=msg;r.appendChild(t);setTimeout(()=>t.remove(),3200);}
function canWrite(modKey){return (ROLE_WRITE[APP.role]||[]).includes(modKey);}
function assetName(id){const a=APP.cache.assets.find(x=>x.id===id);return a?a.name:id||'—';}

/* ============================= BOOT ============================= */
async function boot(){
  applyLang();
  applyTheme();
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(APP.theme==='system') applyTheme(); });
  }
  document.getElementById('watermark').innerHTML = masWatermarkSVG();
  document.getElementById('brandMark').innerHTML = masLogoSVG(24);
  buildNav();
  buildRoleSelect();
  buildLangSelect();
  buildThemeSelect();
  updateOnlinePill();
  window.addEventListener('online',()=>{APP.online=true;updateOnlinePill();flushQueue();});
  window.addEventListener('offline',()=>{APP.online=false;updateOnlinePill();});
  try{
    APP.db = await claude.use('db');
    APP.assetsCap = await claude.use('assets');
    APP.downloadsCap = await claude.use('downloads');
  }catch(e){}
  if(APP.db){
    await seedIfNeeded();

/* ============================= WRITE LAYER (with offline queue + audit) ============================= */
function queuePersist(){localStorage.setItem('cmms_queue', JSON.stringify(APP.queue));}
function queueOffline(op){APP.queue.push(op); queuePersist(); toast(T('toast_offline_saved'));}
function applyLocalOptimistic(op){
  const arr = APP.cache[op.collection] = APP.cache[op.collection]||[];
  if(op.mode==='delete'){ APP.cache[op.collection]=arr.filter(d=>d.id!==op.id); }
  else{
    const idx = arr.findIndex(d=>d.id===op.id);
    const merged = idx>=0 ? {...arr[idx], ...op.data} : {id:op.id, ...op.data};
    if(idx>=0) arr[idx]=merged; else arr.unshift(merged);
  }
  render();
}
async function flushQueue(){
  if(!APP.online || !APP.db || APP.queue.length===0) return;
  while(APP.queue.length){
    const op = APP.queue[0];
    try{
      const ref = APP.db.collection(op.collection).doc(op.id);
      if(op.mode==='delete') await ref.delete();
      else if(op.mode==='update') await ref.update(op.data);
      else await ref.set(op.data);
      APP.queue.shift(); queuePersist();
    }catch(e){ break; }
  }
  if(APP.queue.length===0) toast(T('toast_synced'));
}
async function dbSet(collection, id, data, auditDesc){
  id = id || uid(collection);
  const op = {collection, id, data, mode:'set'};
  if(!APP.online || !APP.db){ queueOffline(op); applyLocalOptimistic(op); return id; }
  try{
    await APP.db.collection(collection).doc(id).set(data);
    writeAudit(auditDesc);
  }catch(e){ queueOffline(op); applyLocalOptimistic(op); }
  return id;
}
async function dbUpdate(collection, id, data, auditDesc){
  const op = {collection, id, data, mode:'update'};
  if(!APP.online || !APP.db){ queueOffline(op); applyLocalOptimistic(op); return; }
  try{
    await APP.db.collection(collection).doc(id).update(data);
    writeAudit(auditDesc);
  }catch(e){ queueOffline(op); applyLocalOptimistic(op); }
}
async function dbDelete(collection, id, auditDesc){
  const op = {collection, id, mode:'delete'};
  if(!APP.online || !APP.db){ queueOffline(op); applyLocalOptimistic(op); return; }
  try{
    await APP.db.collection(collection).doc(id).delete();
    writeAudit(auditDesc);
  }catch(e){ queueOffline(op); applyLocalOptimistic(op); }
}
async function writeAudit(desc){
  if(!APP.db || !APP.online) return;
  try{
    await APP.db.collection('audit_log').add({
      who: APP.role + (APP.techName? (' — '+APP.techName):''),
      what: desc, when: new Date().toISOString(),
    });
  }catch(e){}
}

  const data = {message, severity, assetId:assetId||null, createdAt:new Date().toISOString(), read:false};
  await dbSet('notifications', null, data, T('aud_new_notif')+': '+message);

/* ============================= INSPECTION -> AUTO WO/NOTIFICATION ============================= */
function computeStatus(actual, min, max){
  if(actual==null || isNaN(actual)) return 'Normal';
  min = (min===''||min==null)?null:Number(min);
  max = (max===''||max==null)?null:Number(max);
  if(max!=null && actual> max*1.5) return 'Critical';
  if(max!=null && actual> max) return 'High';
  if(min!=null && actual< min) return 'Attention';
  return 'Normal';
}
async function handleNewInspection(rec, isSeed){
  const status = computeStatus(rec.actualValue, rec.minLimit, rec.maxLimit);
  const okNotOk = (status==='Normal')?'OK':'Not OK';
  const id = isSeed? uid('insp') : null;
  const finalId = await dbSet('inspections', id, {...rec, status, okNotOk}, T('aud_insp_recorded')+': '+rec.parameter+' — '+rec.assetId);
  if(status==='High' || status==='Critical'){
    const woId = await dbSet('work_orders', null, {
      woNumber:'WO-'+Date.now().toString().slice(-6), assetId:rec.assetId, problem:T('wo_problem_tpl',{s:V(status),p:rec.parameter,c:rec.component,v:rec.actualValue,u:(rec.unit?(' '+rec.unit):''),m:(rec.maxLimit??'—')}),
      priority: status==='Critical'?'Critical':'High', plannedDate: todayInput(), assignedTechnician:'', requiredTools:'', requiredSpareParts:'',
      estimatedManHours:'', actualManHours:'', findings:'', correctiveAction:'', status:'Open', supervisorVerification:false, managerApproval:false,
      source:'Inspection', sourceId:finalId,
    }, T('aud_wo_auto')+' — '+rec.assetId);
    await pushNotification(T('notif_auto_alert',{s:V(status),p:rec.parameter,a:assetNameSafe(rec.assetId)}), status, rec.assetId);
  }
  return finalId;
}
function assetNameSafe(id){const a=APP.cache.assets.find(x=>x.id===id); return a?(a.name):id;}

function fieldInput(f, val){
  val = val==null? (f.dv? f.dv(): '') : val;
  const req = f.req?'required':'';
  if(f.t==='asset') return `<select id="fld_${f.k}" ${req} onchange="onAssetFieldChange('${f.k}')">${assetOptions(val)}</select>`;
  if(f.t==='component'){
    const assetVal = document.getElementById('fld_assetId') ? document.getElementById('fld_assetId').value : val && val.__assetId;
    return `<select id="fld_${f.k}" ${req}>${componentOptions(assetVal, val)}</select>`;
  }
  if(f.t==='select') return `<select id="fld_${f.k}" ${req}>${selOptions(f.opts, val)}</select>`;
  if(f.t==='textarea') return `<textarea id="fld_${f.k}" rows="3" placeholder="${esc(f.ph||'')}" ${req}>${esc(val)}</textarea>`;
  if(f.t==='checkbox') return `<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)"><input type="checkbox" id="fld_${f.k}" style="width:auto" ${val?'checked':''}/> ${val?T('common_yes'):T('common_no')}</label>`;
  if(f.t==='photo') return `<input type="file" id="fld_${f.k}" accept="image/*" capture="environment"/>` + (val? `<div style="margin-top:8px"><img class="photothumb" src="/_blob/${val}"/></div>`:'');
  if(f.t==='date') return `<input type="date" id="fld_${f.k}" value="${esc(val)}" ${req}/>`;
  if(f.t==='datetime') return `<input type="datetime-local" id="fld_${f.k}" value="${esc(typeof val==='string' && val.includes('T')? val.slice(0,16): val)}" ${req}/>`;
  if(f.t==='number') return `<input type="number" step="any" id="fld_${f.k}" value="${val===''?'':esc(val)}" placeholder="${esc(f.ph||'')}" ${req} ${f.ro?'readonly':''}/>`;
  return `<input type="text" id="fld_${f.k}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${req} ${f.ro?'readonly':''}/>`;
}
window.onAssetFieldChange = function(k){
  const modKey = document.getElementById('modalRoot').dataset.mod;
  const cfg = MODULES[modKey];
  const compField = cfg.fields.find(f=>f.t==='component');

async function openModal(modKey, existing){
  const cfg = MODULES[modKey];
  const root = document.getElementById('modalRoot');
  root.dataset.mod = modKey;
  root.innerHTML = `<div class="modalbg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${existing? T('modal_edit_prefix')+MT(modKey) : T('modal_add_prefix')+MT(modKey)}<button class="x" onclick="closeModal()">✕</button></h3>
      <div id="modalBody">
        ${cfg.fields.map(f=>`<div class="field"><label>${FL(f.k)}${f.req?' *':''}</label>${fieldInput(f, existing? existing[f.k] : undefined)}</div>`).join('')}
      </div>
      <div class="modalfoot">
        ${existing && canWrite(modKey) ? `<button class="btn danger" onclick="deleteRecord('${modKey}','${existing.id}')">${T('common_delete')}</button>`:''}
        <button class="btn" onclick="closeModal()">${T('common_cancel')}</button>
        <button class="btn primary" onclick="saveRecord('${modKey}'${existing?`,'${existing.id}'`:''})">${T('common_save')}</button>
      </div>
    </div>
  </div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
async function saveRecord(modKey, existingId){
  const cfg = MODULES[modKey];
  const data = {};
  for(const f of cfg.fields){
    const el = document.getElementById('fld_'+f.k);
    if(!el) continue;
    if(f.t==='checkbox') data[f.k]=el.checked;
    else if(f.t==='photo'){
      if(el.files && el.files[0]){
        const pid = await uploadPhoto(el.files[0]);
        if(pid) data[f.k]=pid; else if(existingId) { /* keep old */ } else data[f.k]=null;
      } else if(existingId){ /* leave unchanged: don't overwrite */ }
    }
    else if(f.t==='number') data[f.k] = el.value===''? '' : Number(el.value);
    else if(f.t==='datetime') data[f.k] = el.value? new Date(el.value).toISOString() : '';
    else data[f.k]=el.value;
  }
  for(const f of cfg.fields){ if(f.req && (data[f.k]===undefined||data[f.k]==='')){ toast(T('toast_fill_field',{f:FL(f.k)})); return; } }
  const existing = existingId? (APP.cache[cfg.collection]||[]).find(d=>d.id===existingId) : null;
  if(cfg.onSave){ await cfg.onSave(data, existing); }
  else if(existing){ await dbUpdate(cfg.collection, existingId, data, MT(modKey)+' — '+T('aud_updated')); }
  else{ await dbSet(cfg.collection, null, data, MT(modKey)+' — '+T('aud_created')); }
  toast(T('toast_saved'));
  closeModal();
}
async function deleteRecord(modKey, id){
  if(!confirm(T('common_confirmDelete'))) return;
  const cfg = MODULES[modKey];
  await dbDelete(cfg.collection, id, MT(modKey)+' — '+T('aud_deleted'));
  toast(T('toast_deleted'));
  closeModal();
}

function computeKPIs(){
  const assets = APP.cache.assets;
  const bds = APP.cache.breakdowns;
  const wos = APP.cache.work_orders;
  const pms = APP.cache.pm;
  const sp = APP.cache.spare_parts;
  const running = assets.filter(a=>a.status==='Running').length;
  const stopped = assets.filter(a=>a.status==='Stopped').length;
  const attention = assets.filter(a=>a.status==='Attention').length;
  const openWO = wos.filter(w=>!['Completed','Closed'].includes(w.status)).length;
  const today = todayInput();
  const overduePM = pms.filter(p=>p.nextDue && p.nextDue<today).length;
  const bdToday = bds.filter(b=>(b.notificationTime||'').slice(0,10)===today).length;
  let totalDown=0, count=0;
  bds.forEach(b=>{ if(b.downtimeStart && b.downtimeEnd){ const dh=(new Date(b.downtimeEnd)-new Date(b.downtimeStart))/3600000; if(dh>0){totalDown+=dh; count++;} }});
  const periodHours = 30*24*Math.max(assets.length,1);
  const availability = periodHours>0 ? Math.max(0, 100-((totalDown/periodHours)*100)).toFixed(1) : '100.0';
  const mtbf = count>0 ? ((periodHours-totalDown)/count).toFixed(1) : '—';
  const mttr = count>0 ? (totalDown/count).toFixed(1) : '—';
  const cost = bds.reduce((s,b)=>s+(Number(b.repairCost)||0),0);
  const lowStock = sp.filter(p=>Number(p.stock)<=Number(p.minStock||0)).length;
  return {running,stopped,attention,openWO,overduePM,bdToday,availability,mtbf,mttr,cost,lowStock,totalDown:totalDown.toFixed(0)};
}
function kpiCard(icon,value,label,tone){
  return `<div class="kpi kpi-${tone||'plain'}"><div class="kpi-ic">${icon}</div><div><div class="v ${tone||''}">${value}</div><div class="l">${label}</div></div></div>`;
}
function gaugeSVG(pct){
  pct = Math.max(0,Math.min(100, Number(pct)||0));
  const r=52, c=2*Math.PI*r;
  const offset = c*(1-pct/100);
  const color = pct>=95?'var(--green)':pct>=85?'var(--amber)':'var(--red)';
  return `<svg viewBox="0 0 140 140" width="132" height="132">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="11"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 70 70)"/>
    <text x="70" y="65" text-anchor="middle" fill="var(--text)" font-family="IBM Plex Mono" font-size="25" font-weight="700">${pct}%</text>
    <text x="70" y="84" text-anchor="middle" fill="var(--dim)" font-size="10.5" font-family="IBM Plex Sans Arabic">${T('kpi_availability').split(' ')[0]}</text>
  </svg>`;
}

function renderKpiCharts(compact){
  const bds = APP.cache.breakdowns;
  const wos = APP.cache.work_orders;
  const byAsset = {};
  APP.cache.assets.forEach(a=>byAsset[a.id]=0);
  bds.forEach(b=>{byAsset[b.assetId]=(byAsset[b.assetId]||0)+1;});
  const max = Math.max(1,...Object.values(byAsset));
  const bars = Object.entries(byAsset).map(([id,v],i)=>{
    const h = Math.round((v/max)*100);
    return `<g transform="translate(${i*70+20},0)">
      <rect x="0" y="${140-h}" width="40" height="${h}" fill="var(--amber)" rx="2"></rect>
      <text x="20" y="155" fill="var(--dim)" font-size="10" text-anchor="middle">${id}</text>
      <text x="20" y="${132-h}" fill="var(--text)" font-size="11" text-anchor="middle">${v}</text>
    </g>`;
  }).join('');
  const planned = wos.filter(w=>w.source!=='Breakdown').length;
  const unplanned = wos.filter(w=>w.source==='Breakdown').length;
  const totalW = Math.max(1, planned+unplanned);
  const pctP = Math.round(planned/totalW*100);

  return `<div class="grid g2">
    <div class="panel"><h2>${T('chart_breakdown_by_asset')}</h2>
      <svg class="svgchart" viewBox="0 0 ${Math.max(280,Object.keys(byAsset).length*70+20)} 165" width="100%" height="165">${bars||`<text x="10" y="80" fill="var(--dim)" font-size="12">${T('chart_no_data')}</text>`}</svg>
    </div>
    <div class="panel"><h2>${T('chart_planned_vs_unplanned')}</h2>
      <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
        <div style="flex:1;background:var(--bg2);border-radius:20px;height:22px;overflow:hidden;display:flex;border:1px solid var(--border)">
          <div style="width:${pctP}%;background:var(--green)"></div><div style="width:${100-pctP}%;background:var(--red)"></div>
        </div>
        <div style="font-family:var(--mono);font-size:12px;white-space:nowrap">${planned} / ${unplanned}</div>
      </div>
      <div class="hint">🟢 ${T('chart_planned_label')} (${pctP}%) &nbsp; 🔴 ${T('chart_unplanned_label')} (${100-pctP}%)</div>
    </div>
  </div>`;
}
function renderKPI(){
  const k = computeKPIs();
  const pmDone = APP.cache.pm.filter(p=>p.lastDone).length;
  const pmCompliance = APP.cache.pm.length? Math.round(pmDone/APP.cache.pm.length*100):100;
  const closedOnTime = APP.cache.work_orders.filter(w=>['Completed','Closed'].includes(w.status)).length;
  const schedCompliance = APP.cache.work_orders.length? Math.round(closedOnTime/APP.cache.work_orders.length*100):100;
  return `<div class="grid g4">
    ${kpiCard('📈', k.availability+'%', T('kpi_availability'),'green')}
    ${kpiCard('⏱️', k.mtbf, T('kpi_mtbf'))}
    ${kpiCard('🔧', k.mttr, T('kpi_mttr'))}
    ${kpiCard('✅', pmCompliance+'%', T('kpi_pm_compliance'))}
    ${kpiCard('📋', schedCompliance+'%', T('kpi_sched_compliance'))}
    ${kpiCard('🧰', k.openWO, T('kpi_backlog'),'amber')}
    ${kpiCard('💵', '$'+k.cost.toLocaleString(), T('kpi_cost'))}
    ${kpiCard('🛑', k.totalDown, T('kpi_total_downtime'), k.totalDown>0?'red':'plain')}
  </div>
  ${renderKpiCharts()}
  <div class="panel"><h2>${T('spareparts_progress_panel')}</h2>
    <div class="twrap"><table><thead><tr><th>${T('th_part')}</th><th>${T('th_stock')}</th><th>${T('th_min')}</th><th>${T('th_status')}</th></tr></thead><tbody>
    ${APP.cache.spare_parts.map(p=>`<tr><td>${esc(p.partNumber)}</td><td>${p.stock}</td><td>${p.minStock}</td><td>${Number(p.stock)<=Number(p.minStock||0)?badge('Attention'):badge('Normal')}</td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">${T('common_no_data')}</div></td></tr>`}
    </tbody></table></div>
  </div>`;
}

/* ============================= NOTIFICATIONS ============================= */
function renderNotifications(){

  return `<div class="panel"><h2>${T('notif_title')} <small>${list.length}</small>
    ${list.length? `<button class="btn small" onclick="markAllRead()">${T('notif_markall')}</button>`:''}
  </h2>
  ${list.length? list.map(n=>`<div class="notif ${n.read?'':'unread'}">
    <div class="m">${badge(n.severity||'Attention')} ${esc(n.message)} ${n.assetId?('· '+esc(assetNameSafe(n.assetId))):''}</div>
    <div class="t">${fmtDT(n.createdAt)} ${!n.read?`<button class="btn small" style="margin-inline-start:8px;padding:2px 8px" onclick="markRead('${n.id}')">${T('notif_markread')}</button>`:''}</div>

async function markRead(id){ await dbUpdate('notifications', id, {read:true}, T('notif_title')+' — '+T('notif_markread')); }
async function markAllRead(){ for(const n of APP.cache.notifications){ if(!n.read) await dbUpdate('notifications', n.id, {read:true}, T('notif_markall')); } }

/* ============================= EXPORT / BI ============================= */
function toCSV(rows){
  if(!rows.length) return '';
  const keys = Object.keys(rows[0]);
  const esc2 = v=>{ v = v==null? '' : String(v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; };
  return keys.join(',')+'\n'+rows.map(r=>keys.map(k=>esc2(r[k])).join(',')).join('\n');
}
async function exportRows(rows, filename){
  if(!rows.length){ toast(T('toast_export_nodata')); return; }
  const csv = toCSV(rows);
  if(!APP.downloadsCap){ toast(T('toast_export_unavailable')); return; }
  try{
    await APP.downloadsCap.save({filename: filename+'.csv', data: csv});
    toast(T('toast_export_success'));
  }catch(e){ toast(T('toast_export_fail')); }
}
async function exportCSV(collection, label){ await exportRows(APP.cache[collection]||[], label); }
function renderExport(){
  const items = ['assets','inspections','pm','work_orders','breakdowns','rca','spare_parts','shutdowns','audit_log','notifications'];
  return `<div class="panel"><h2>${T('export_title')}</h2>
    <p class="hint" style="margin-top:0">${T('export_hint')}</p>
    <div class="grid g3">
    ${items.map(c=>`<div class="kpi" style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="l" style="margin:0">${c==='assets'?T('nav_assets'):(MODULES[c]?MT(c):T('nav_'+c))}</div><div style="font-family:var(--mono);font-size:11px;color:var(--dim2)">${(APP.cache[c]||[]).length} ${T('common_records')}</div></div>
      <button class="btn small" onclick="exportCSV('${c}','${c}')">${T('common_export_csv')}</button>
    </div>`).join('')}
    </div>
  </div>`;
}

/* ============================= REPORTS ============================= */
const REPORT_TYPES = ['work_orders','pm','breakdowns','cost','technician','spare_parts','upcoming_pm'];
function reportPeriodRange(period, from, to){
  const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(period==='today'){ return {from:iso(now), to:iso(now)}; }
  if(period==='week'){ const d=new Date(now); d.setDate(d.getDate()-7); return {from:iso(d), to:iso(now)}; }
  if(period==='month'){ const d=new Date(now); d.setDate(d.getDate()-30); return {from:iso(d), to:iso(now)}; }
  return {from: from||iso(now), to: to||iso(now)};
}
function renderReports(){
  const st = APP._reports || (APP._reports = {type:'work_orders', period:'month', from:todayInput(), to:todayInput(), asset:'', status:'', tech:''});
  const range = reportPeriodRange(st.period, st.from, st.to);
  const {rows, summary, columns, chart} = buildReport(st.type, range, st);

  return `<div class="panel">
    <h2>${T('reports_title')}</h2>
    <div class="grid g3">
      <div class="field"><label>${T('reports_type')}</label>
        <select id="rptType" onchange="updReport('type',this.value)">${REPORT_TYPES.map(t=>`<option value="${t}" ${t===st.type?'selected':''}>${T('rpt_'+t)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>${T('reports_period')}</label>
        <select id="rptPeriod" onchange="updReport('period',this.value)">
          <option value="today" ${st.period==='today'?'selected':''}>${T('reports_today')}</option>
          <option value="week" ${st.period==='week'?'selected':''}>${T('reports_week')}</option>
          <option value="month" ${st.period==='month'?'selected':''}>${T('reports_month')}</option>
          <option value="custom" ${st.period==='custom'?'selected':''}>${T('reports_custom')}</option>
        </select>
      </div>
      <div class="field"><label>${T('reports_asset')}</label>
        <select id="rptAsset" onchange="updReport('asset',this.value)">${assetOptions(st.asset)}</select>
      </div>
      ${st.period==='custom'?`
      <div class="field"><label>${T('reports_from')}</label><input type="date" value="${esc(st.from)}" onchange="updReport('from',this.value)"/></div>
      <div class="field"><label>${T('reports_to')}</label><input type="date" value="${esc(st.to)}" onchange="updReport('to',this.value)"/></div>
      `:''}
      <div class="field"><label>${T('reports_technician')}</label><input value="${esc(st.tech)}" oninput="updReport('tech',this.value)" placeholder="${T('reports_all')}"/></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn small" onclick="exportRows(window._rptRows||[], 'report_${st.type}')">${T('common_export_csv')}</button>
      <button class="btn small" onclick="window.print()">${T('common_print_pdf')}</button>
    </div>
  </div>

  <div class="grid g4">
    ${summary.map(s=>kpiCard(s.icon, s.value, s.label, s.tone)).join('')}
  </div>

  ${chart?`<div class="panel"><h2>${T('reports_summary')}</h2>${chart}</div>`:''}

  <div class="panel"><h2>${T('reports_table')} <small>${rows.length} ${T('common_records')}</small></h2>
    <div class="twrap"><table>
      <thead><tr>${columns.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead>
      <tbody>${rows.length? rows.map(r=>`<tr>${columns.map(c=>`<td>${c.f? c.f(r):esc(r[c.k]==null?'—':r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${columns.length}"><div class="empty">${T('reports_no_data')}</div></td></tr>`}</tbody>
    </table></div>
  </div>`;
}
function updReport(k,v){ APP._reports[k]=v; render(); }
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  const d = dateStr.slice(0,10);
  return d>=from && d<=to;
}
function buildReport(type, range, st){
  let rows=[], columns=[], summary=[], chart='';
  const {from,to} = range;
  if(type==='work_orders'){
    rows = APP.cache.work_orders.filter(w=>inRange(w.plannedDate,from,to) && (!st.asset||w.assetId===st.asset) && (!st.tech||(w.assignedTechnician||'').includes(st.tech)));
    columns = [
      {k:'woNumber',l:T('f_woNumber')},{k:'assetId',l:T('f_assetId'),f:r=>assetNameSafe(r.assetId)},
      {k:'priority',l:T('f_priority'),f:r=>badge(r.priority)},{k:'plannedDate',l:T('f_plannedDate'),f:r=>fmtD(r.plannedDate)},
      {k:'status',l:T('f_status'),f:r=>badge(r.status)},{k:'assignedTechnician',l:T('f_assignedTechnician')},
    ];
    const open = rows.filter(r=>!['Completed','Closed'].includes(r.status)).length;
    const done = rows.length-open;
    summary=[{icon:'🧰',value:rows.length,label:T('rs_total')},{icon:'📂',value:open,label:T('rs_open'),tone:'amber'},{icon:'✅',value:done,label:T('rs_completed'),tone:'green'}];
  } else if(type==='pm'){
    rows = APP.cache.pm.filter(p=>(!st.asset||p.assetId===st.asset));
    columns=[{k:'assetId',l:T('f_assetId'),f:r=>assetNameSafe(r.assetId)},{k:'component',l:T('f_component')},{k:'task',l:T('f_task')},
      {k:'freqType',l:T('f_freqType'),f:r=>V(r.freqType)},{k:'nextDue',l:T('f_nextDue'),f:r=>fmtD(r.nextDue)}];
    const today=todayInput();
    const overdue = rows.filter(r=>r.nextDue && r.nextDue<today).length;
    const upcoming = rows.filter(r=>r.nextDue && r.nextDue>=today && r.nextDue<=to).length;
    summary=[{icon:'🗓️',value:rows.length,label:T('rs_total')},{icon:'⚠️',value:overdue,label:T('rs_overdue'),tone:overdue>0?'red':'plain'},{icon:'⏭️',value:upcoming,label:T('rs_upcoming'),tone:'amber'}];
  } else if(type==='breakdowns'){
    rows = APP.cache.breakdowns.filter(b=>inRange(b.notificationTime,from,to) && (!st.asset||b.assetId===st.asset));
    columns=[{k:'assetId',l:T('f_assetId'),f:r=>assetNameSafe(r.assetId)},{k:'failureMode',l:T('f_failureMode')},
      {k:'notificationTime',l:T('f_notificationTime'),f:r=>fmtDT(r.notificationTime)},{k:'repairCost',l:T('f_repairCost'),f:r=>r.repairCost?('$'+r.repairCost):'—'},{k:'status',l:T('f_status'),f:r=>badge(r.status)}];
    let totalDown=0; rows.forEach(b=>{ if(b.downtimeStart&&b.downtimeEnd){ const h=(new Date(b.downtimeEnd)-new Date(b.downtimeStart))/3600000; if(h>0) totalDown+=h; }});
    const cost = rows.reduce((s,b)=>s+(Number(b.repairCost)||0),0);
    summary=[{icon:'🛑',value:rows.length,label:T('rs_total')},{icon:'⏱️',value:totalDown.toFixed(0),label:T('rs_downtime_hours'),tone:'red'},{icon:'💵',value:'$'+cost.toLocaleString(),label:T('rs_repair_cost')}];
  } else if(type==='cost'){
    rows = APP.cache.breakdowns.filter(b=>inRange(b.notificationTime,from,to) && Number(b.repairCost)>0 && (!st.asset||b.assetId===st.asset));
    columns=[{k:'assetId',l:T('f_assetId'),f:r=>assetNameSafe(r.assetId)},{k:'failureMode',l:T('f_failureMode')},{k:'notificationTime',l:T('f_notificationTime'),f:r=>fmtDT(r.notificationTime)},{k:'repairCost',l:T('f_repairCost'),f:r=>'$'+r.repairCost}];
    const cost = rows.reduce((s,b)=>s+(Number(b.repairCost)||0),0);
    summary=[{icon:'💵',value:'$'+cost.toLocaleString(),label:T('rs_repair_cost')},{icon:'🧾',value:rows.length,label:T('rs_count')}];
  } else if(type==='technician'){
    const woR = APP.cache.work_orders.filter(w=>inRange(w.plannedDate,from,to) && (!st.tech||(w.assignedTechnician||'').includes(st.tech)));
    const inspR = APP.cache.inspections.filter(i=>inRange(i.datetime,from,to) && (!st.tech||(i.technician||'').includes(st.tech)));
    const byTech = {};
    woR.forEach(w=>{ const t=w.assignedTechnician||'—'; byTech[t]=byTech[t]||{wo:0,insp:0,hrs:0}; byTech[t].wo++; byTech[t].hrs+=Number(w.actualManHours)||0; });
    inspR.forEach(i=>{ const t=i.technician||'—'; byTech[t]=byTech[t]||{wo:0,insp:0,hrs:0}; byTech[t].insp++; });
    rows = Object.entries(byTech).map(([t,v])=>({tech:t,...v}));
    columns=[{k:'tech',l:T('f_technician')},{k:'wo',l:T('nav_work_orders')},{k:'insp',l:T('nav_inspections')},{k:'hrs',l:T('rs_avg_manhours')}];
    summary=[{icon:'👷',value:rows.length,label:T('rs_count')},{icon:'🧰',value:woR.length,label:T('nav_work_orders')},{icon:'🔍',value:inspR.length,label:T('nav_inspections')}];
  } else if(type==='spare_parts'){
    rows = APP.cache.spare_parts;
    columns=[{k:'partNumber',l:T('f_partNumber')},{k:'description',l:T('f_description')},{k:'stock',l:T('f_stock')},{k:'reserved',l:T('f_reserved')},
      {k:'minStock',l:T('f_minStock')},{k:'status',l:T('f_status'),f:r=>Number(r.stock)<=Number(r.minStock||0)?badge('Attention'):badge('Normal')}];
    const low = rows.filter(p=>Number(p.stock)<=Number(p.minStock||0)).length;
    summary=[{icon:'📦',value:rows.length,label:T('rs_total')},{icon:'⚠️',value:low,label:T('kpi_low_stock'),tone:low>0?'amber':'plain'}];
  } else if(type==='upcoming_pm'){
    rows = APP.cache.pm.filter(p=>p.nextDue && p.nextDue>=from && p.nextDue<=to && (!st.asset||p.assetId===st.asset)).sort((a,b)=>(a.nextDue||'').localeCompare(b.nextDue||''));
    columns=[{k:'assetId',l:T('f_assetId'),f:r=>assetNameSafe(r.assetId)},{k:'component',l:T('f_component')},{k:'task',l:T('f_task')},{k:'nextDue',l:T('f_nextDue'),f:r=>fmtD(r.nextDue)}];
    summary=[{icon:'⏭️',value:rows.length,label:T('rs_upcoming')}];
  }
  window._rptRows = rows;
  return {rows, columns, summary, chart};
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const v = document.getElementById('view');
  const roleSel = document.getElementById('roleSel'); if(roleSel) roleSel.value = APP.role;
  updateBell();
  let html='';
  switch(APP.route){
    case 'dashboard': html = renderDashboard(); break;
    case 'assets': html = renderAssets(); break;
    case 'kpi': html = renderKPI(); break;
    case 'reports': html = renderReports(); break;
    case 'notifications': html = renderNotifications(); break;
    case 'audit': html = renderAudit(); break;
    case 'users': html = renderUsers(); break;
    case 'export': html = renderExport(); break;
    default:
      if(MODULES[APP.route]) html = renderGenericModule(APP.route);
      else html = `<div class="empty">${T('common_no_data')}</div>`;
  }
  v.innerHTML = html;
  if(APP.route==='users'){
    const s2 = document.getElementById('roleSel2');
    if(s2){ s2.innerHTML = ROLES.map(r=>`<option value="${r}" ${r===APP.role?'selected':''}>${T('role_'+r)}</option>`).join('');
      s2.onchange=()=>{APP.role=s2.value; localStorage.setItem('cmms_role',APP.role); buildRoleSelect(); toast(T('toast_role_changed',{r:T('role_'+APP.role)})); };}
  }
}

boot();
</script>
